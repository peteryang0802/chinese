    <h1>七年级上册</h1>
    <p class="lead">六个单元，从四季风景写到想象世界。每课都分三步：先热身、再读懂、最后回味。点任意一课开始。</p>

<footer class="foot wrap">我的语文书房 · 课前预习 · 课后复习</footer>

<script src="data.js"></script>
<script>
(function(){
  function pad(n){return (n<10?'0':'')+n;}
  var html='';
  BOOK_G7A.units.forEach(function(u){
    html+='<section class="unit" style="--uc:'+u.color+'">'
      +'<div class="unit-head" style="background:'+u.color+'">'
      +'<span class="no">'+pad(u.id)+'</span>'
      +'<span class="utitle">'+u.title+'</span>'
      +'<span class="utheme">'+u.theme+'</span></div><div class="lessons">';
    u.lessons.forEach(function(l){
      html+='<a class="lesson-item" href="lesson-'+pad(l.no)+'.html">'
        +'<span class="ln">'+l.no+'</span>'
        +'<span class="lt">'+l.title+(l.star?'<span class="lstar">（自读）</span>':'')+'</span>'
        +'<span class="tag-type" style="background:'+u.color+'1f;color:'+u.color+'">'+l.type+'</span>'
        +'<span class="lau">'+l.author+'</span></a>';
    });
    html+='</div><div class="extra">';
    u.extras.forEach(function(x){
      html+='<a href="'+x.href+'">'+x.label+'</a>';
    });
    html+='</div></section>';
  });
  document.getElementById('toc').innerHTML=html;
})();
</script>
</body>
